<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Артём Ветров — Creative Developer</title>
  <meta name="description" content="Интерактивное 3D-портфолио: катайся на машинке, находи проекты">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="noise"></div>

  <div id="loader">
    <div class="loader-logo">АВ<span>.</span></div>
    <div class="loader-status">Загружаю мир…</div>
    <div class="loader-tip">Открыть консоль браузера — F12</div>
  </div>

  <canvas id="scene"></canvas>

  <div class="hud">
    <div class="hud-name">Артём Ветров<span>creative developer</span></div>
    <div class="hud-hint">
      <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
      <em>или стрелки — ехать</em>
      <span class="key wide">CTRL</span><em>сигналить</em>
    </div>
  </div>

  <div id="panel">
    <button id="panel-close" aria-label="Закрыть">×</button>
    <div id="panel-tag"></div>
    <h2 id="panel-title"></h2>
    <p id="panel-text"></p>
    <a id="panel-link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="touch">
    <div class="touch-group">
      <button data-k="left">◀</button>
      <button data-k="forward">▲</button>
      <button data-k="back">▼</button>
      <button data-k="right">▶</button>
    </div>
  </div>

  <script>
    setTimeout(function () {
      var l = document.getElementById('loader');
      if (l && !window.__sceneLoaded) {
        l.classList.add('error');
        l.querySelector('.loader-status').textContent = 'Сцена не запустилась';
        l.querySelector('.loader-tip').textContent = 'Смотри ошибки в консоли браузера (F12)';
      }
    }, 9000);
  </script>
  <script src="vendor/three.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
